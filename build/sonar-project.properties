# SonarQube Project Configuration
# Order Management API

# Project identification
sonar.projectKey=order-management
sonar.projectName=Order Management API
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=cs

# Exclusions from analysis
sonar.exclusions=\
  **/Migrations/**,\
  **/obj/**,\
  **/bin/**,\
  **/*.Designer.cs,\
  **/wwwroot/**,\
  **/node_modules/**

# Exclusions from coverage
sonar.coverage.exclusions=\
  **/Program.cs,\
  **/Migrations/*.cs,\
  **/*Tests/**,\
  **/*Test.cs,\
  **/DatabaseMigrationExtensions.cs,\
  **/OpenTelemetryExtensions.cs,\
  **/DTOs/**,\
  **/Entities/**

# Test exclusions
sonar.test.exclusions=\
  **/obj/**,\
  **/bin/**

# Coverage reports
sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=TestResults/**/*.trx

# Code duplication
sonar.cpd.exclusions=\
  **/*Tests/**,\
  **/Migrations/**

# Issue ignore rules (optional)
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S1118
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/Program.cs
